name: Emploi du temps
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: edt
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger l'emploi du temps
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0" "https://vt.iut-amiens.fr/gc2021/icsetudiant/but_d1.ics" -o edt.tmp
          grep -q "BEGIN:VCALENDAR" edt.tmp || { echo "Pas d'emploi du temps"; exit 1; }
          grep -v -E '^(DTSTAMP|UID)' edt.tmp > edt.ics && rm edt.tmp
      - name: Enregistrer si ça a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edt.ics
          git diff --cached --quiet && { echo "Pas de changement"; exit 0; }
          git commit -m "Mise à jour de l'emploi du temps"
          git push
